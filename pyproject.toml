[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "augent-usecase"
version = "0.1.0"
description = "Independent business use case powered by Augent Core"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "augent-core==0.1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
augent-usecase = "augent_usecase.cli:main"

[tool.setuptools.packages.find]
include = ["augent_usecase*"]

[tool.setuptools.package-data]
augent_usecase = ["workflow.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
